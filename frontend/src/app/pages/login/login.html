<main class="login-page">
	<section class="login-card">
		<h1>Welcome to GameHub</h1>
		<p>Login to start your gaming adventure.</p>

		<form (ngSubmit)="onSubmit()">
			<div class="mb-3">
				<label for="email" class="form-label">Email</label>

				<input
					id="email"
					name="email"
					type="email"
					class="form-control"
					[(ngModel)]="email"
					autocomplete="email"
					required
				/>
			</div>

			<div class="mb-3">
				<label for="password" class="form-label">Password</label>

				<input
					id="password"
					name="password"
					type="password"
					class="form-control"
					[(ngModel)]="password"
					autocomplete="current-password"
					required
				/>
			</div>

			@if (error()) {
				<p class="error-message" role="alert">
					{{ error() }}
				</p>
			}

			<button
				type="submit"
				class="btn btn-primary w-100"
				[disabled]="loading()">
				{{ loading() ? 'Logging in...' : 'Log in' }}
			</button>
		</form>
	</section>
</main>
