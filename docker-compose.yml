services:
  mock-api:
      build:
          context: ./mock-api
          dockerfile: Dockerfile
      ports:
          - '4001:4001'
      volumes:
          - ./mock-api:/app
          - /app/bin
          - /app/obj
      networks:
          - private-network
      healthcheck:
          test: ['CMD-SHELL', 'curl -fs http://localhost:4001/health || exit 1']
          interval: 5s
          timeout: 3s
          retries: 20
      restart: unless-stopped
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env (copy .env.example)}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    networks:
      - private-network

networks:
    private-network:
        driver: bridge

volumes:
  sqldata:
